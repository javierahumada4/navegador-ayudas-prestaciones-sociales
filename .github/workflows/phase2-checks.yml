name: IMV phase 2 tool loop checks

on:
  push:
    branches:
      - 'feat/**'
    paths:
      - 'tool_use/**'
      - 'rlm/ruleset_catalog.py'
      - 'rlm/imv_engine.py'
      - 'tests/test_ruleset_tools.py'
      - 'tests/test_imv_engine.py'
      - 'tests/test_tool_*.py'
      - 'tests/test_calcular_imv_tool.py'
      - 'tests/test_api.py'
      - '.github/workflows/phase2-checks.yml'
  workflow_dispatch:

jobs:
  tool-use-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight CPU dependencies
        run: |
          python -m pip install 'pydantic>=2.11' 'fastapi>=0.115' \
            'httpx>=0.28' 'pytest>=8.3' 'requests>=2.32' \
            'uvicorn>=0.34' 'python-dotenv>=1.1' 'ruff>=0.11'
      - name: Verify syntax
        run: python -m compileall -q tool_use rlm/ruleset_catalog.py rlm/imv_engine.py tests/test_tool_executor.py tests/test_calcular_imv_tool.py tests/test_ruleset_tools.py
      - name: Run tool-use and API unit tests
        run: |
          python -m pytest -q \
            tests/test_calcular_imv_tool.py \
            tests/test_ruleset_tools.py \
            tests/test_imv_engine.py \
            tests/test_tool_executor.py \
            tests/test_tool_registry.py \
            tests/test_tool_parser.py \
            tests/test_api.py
      - name: Verify basic lint
        run: python -m ruff check --select E4,E7,E9,F tool_use rlm/ruleset_catalog.py rlm/imv_engine.py tests/test_tool_executor.py tests/test_calcular_imv_tool.py tests/test_ruleset_tools.py
