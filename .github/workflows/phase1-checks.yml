name: IMV phase 1 logic checks

on:
  push:
    branches:
      - 'fix/**'
      - 'refactor/**'
  pull_request:
    paths:
      - 'rlm/**'
      - 'tests/**'
      - '.github/workflows/phase1-checks.yml'

jobs:
  logic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax checks
        run: python -m compileall -q rlm tests
      - name: Install pytest
        run: python -m pip install pytest
      - name: CPU logic regression tests
        run: |
          python -m pytest -q \
            tests/test_generate_problems.py \
            tests/test_validate_data.py \
            tests/test_pipeline.py \
            tests/test_imv_engine.py \
            tests/test_rewards.py \
            tests/test_verifier.py
      - name: Generate and verify the full 800/200/100 split on CPU
        run: python -m rlm.pipeline --through-stage generate --run-dir runs/ci-phase1
      - name: Full pipeline dry run
        run: python -m rlm.pipeline --dry-run

  cpu-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only torch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
      - name: Install test dependencies without GPU training
        run: |
          python -m pip install pytest fastapi httpx pydantic matplotlib \
            datasets python-dotenv tqdm ruff uvicorn requests rich
      - name: Check trainer package APIs without downloading models
        run: |
          python -m pip install 'trl>=1.13,<2' 'peft>=0.18' 'transformers>=5,<6' 'accelerate>=1.5'
          python -m pytest -q tests/test_training_config_contract.py
      - name: Full repository unit suite on CPU
        run: python -m pytest -q
      - name: Basic static lint (syntax, unused names)
        if: always()
        run: python -m ruff check --select E4,E7,E9,F .

  dependency-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Verify committed uv.lock matches pyproject.toml
        run: uv lock --check
