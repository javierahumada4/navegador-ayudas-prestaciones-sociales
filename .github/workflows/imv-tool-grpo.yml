name: IMV tool-GRPO CPU checks

on:
  push:
    branches:
      - 'feat/**'
    paths:
      - 'tool_use/**'
      - 'tests/test_imv_*.py'
      - '.github/workflows/imv-tool-grpo.yml'
  workflow_dispatch:

jobs:
  imv-tool-grpo:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight dependencies (no CUDA/model)
        run: |
          python -m pip install 'pydantic>=2.11' 'fastapi>=0.115' \
            'httpx>=0.28' 'pytest>=8.3' 'requests>=2.32' \
            'uvicorn>=0.34' 'python-dotenv>=1.1' 'ruff>=0.11'
      - name: Compile source
        run: python -m compileall -q tool_use tests/test_imv_tool.py tests/test_imv_tool_grpo.py tests/test_imv_tool_loop.py tests/test_imv_compare.py tests/test_imv_tool_prompt.py tests/test_imv_tool_schema.py
      - name: Test tool, executor, training rewards, and comparison
        run: |
          python -m pytest -q \
            tests/test_imv_tool.py \
            tests/test_imv_tool_grpo.py \
            tests/test_imv_tool_loop.py \
            tests/test_imv_compare.py \
            tests/test_imv_tool_prompt.py \
            tests/test_imv_tool_schema.py \
            tests/test_tool_registry.py \
            tests/test_tool_parser.py \
            tests/test_api.py
      - name: Basic lint
        run: |
          python -m ruff check --select E4,E7,E9,F \
            tool_use/imv_tools.py tool_use/imv_data.py tool_use/tools.py \
            tool_use/executor.py tool_use/train_tool_grpo.py \
            tool_use/tool_grpo_rewards.py tool_use/compare_imv.py \
            tool_use/tool_prompt.py tool_use/trl_tool_schema.py \
            tests/test_imv_tool.py tests/test_imv_tool_grpo.py \
            tests/test_imv_tool_loop.py tests/test_imv_compare.py tests/test_imv_tool_prompt.py tests/test_imv_tool_schema.py
