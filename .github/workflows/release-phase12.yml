name: Release phases 1 and 2 CPU validation

on:
  push:
    branches:
      - release/fases-1-2-definitiva
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  phase2-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU runtime and testing dependencies
        run: |
          python -m pip install 'pydantic>=2.11' 'fastapi>=0.115' 'httpx>=0.28' 'pytest>=8.3' 'requests>=2.32' 'uvicorn>=0.34' 'python-dotenv>=1.1' 'rich>=13.9' 'ruff>=0.11'
      - name: Verify Python syntax
        run: python -m compileall -q api rlm tool_use tests
      - name: Test phase 1 numerical engine and phase 2 tool workflows
        run: |
          python -m pytest -q \
            tests/test_imv_engine.py \
            tests/test_generate_problems.py \
            tests/test_validate_data.py \
            tests/test_phase2_imv_tools.py \
            tests/test_phase2_stages.py \
            tests/test_phase2_tracing.py \
            tests/test_phase2_workflows.py \
            tests/test_boe_tool.py \
            tests/test_release_phase12.py \
            tests/test_tool_registry.py \
            tests/test_tool_parser.py \
            tests/test_api.py
      - name: Lint Python errors
        run: python -m ruff check --select E4,E7,E9,F api tool_use tests/test_phase2_imv_tools.py tests/test_phase2_stages.py tests/test_phase2_tracing.py tests/test_phase2_workflows.py tests/test_boe_tool.py tests/test_release_phase12.py
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv lock --check
