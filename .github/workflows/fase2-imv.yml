name: Fase 2 IMV tools CPU

on:
  push:
    branches:
      - 'feat/**'
    paths:
      - 'tool_use/**'
      - 'tests/test_imv_*.py'
      - '.github/workflows/fase2-imv.yml'
  workflow_dispatch:

jobs:
  fase2-imv:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight CPU test dependencies
        run: |
          python -m pip install 'pydantic>=2.11' 'fastapi>=0.115' \
            'httpx>=0.28' 'pytest>=8.3' 'requests>=2.32' \
            'uvicorn>=0.34' 'python-dotenv>=1.1' 'ruff>=0.11'
      - name: Check syntax
        run: python -m compileall -q tool_use tests/test_imv_tool.py tests/test_imv_tool_loop.py tests/test_imv_templates.py
      - name: Test IMV tools, executor, original parser and API
        run: |
          python -m pytest -q \
            tests/test_imv_tool.py \
            tests/test_imv_templates.py \
            tests/test_imv_tool_loop.py \
            tests/test_tool_registry.py \
            tests/test_tool_parser.py \
            tests/test_api.py
      - name: Basic lint
        run: |
          python -m ruff check --select E4,E7,E9,F \
            tool_use/imv_tools.py tool_use/imv_templates.py \
            tool_use/tools.py tool_use/executor.py \
            tests/test_imv_tool.py tests/test_imv_templates.py \
            tests/test_imv_tool_loop.py
